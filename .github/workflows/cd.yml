name: CD

# Manual only: there is no Twenty server to deploy to on every merge.
# Set TWENTY_DEPLOY_URL and the TWENTY_DEPLOY_API_KEY secret before running it.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TWENTY_DEPLOY_URL: http://localhost:2020

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-and-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: twentyhq/twenty/.github/actions/deploy-twenty-app@main
        with:
          api-url: ${{ env.TWENTY_DEPLOY_URL }}
          api-key: ${{ secrets.TWENTY_DEPLOY_API_KEY }}

      - name: Install
        uses: twentyhq/twenty/.github/actions/install-twenty-app@main
        with:
          api-url: ${{ env.TWENTY_DEPLOY_URL }}
          api-key: ${{ secrets.TWENTY_DEPLOY_API_KEY }}
